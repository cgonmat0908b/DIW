<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <?xml version="1.0" standalone="no"?>

    <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" version="1.1" style="background-color: yellow;">
        <defs>
            <style>
                #MyRect {
                stroke: black;
                fill: red;
                }
                .clase1{
                    stroke:blue;
                    fill: green;
                }
                .clase1:hover{
                    stroke:blue;
                    fill: white;
                }
            </style>
        </defs>
        <rect x="10" height="180" y="10" width="180" id="MyRect"/>
        <rect x="20" height="160" y="20" width="160" class="clase1"/>
    </svg>
    <br>

    <svg viewBox="-100 -100 310 310" xmlns="http://www.w3.org/2000/svg" width="200" height="200" style="background-color: yellow;">
        <defs>
            <style
                >#circ:hover{
                    stroke: black; fill: blue;
                };
            </style>
        </defs>
        <circle cx="100" cy="100" r="100" stroke="darkorange" fill="transparent" stroke-width="15" id="circ"/>
    </svg>
    
    <br>

    <svg viewBox="-100 -100 310 310" xmlns="http://www.w3.org/2000/svg" width="200" height="200" style="background-color: yellow;">
        <defs>
            <style>
                .texto:hover{
                    fill: red;
                }
            </style>
        </defs>
        <text x="10" y="10" class="texto"><tspan dy="" style="font-weight: bold;" font-size="50px" fill="blue">Hola</tspan> <tspan dy="-10">como estas</tspan></text>
    </svg>
    <br>

    <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" style="background-color: yellow;">
        
        <path id="my_path" d="M 20,20 C 80,60 100,40 120,20" fill="transparent" stroke="black" stroke-width="1"/>
        
        <text>
            <textPath href="#my_path">
            Viva el Barcelona
            </textPath>
        </text>

        <style>
            text {
                dominant-baseline: hanging; font: 10px Verdana, Helvetica, Arial, sans-serif;
            }
        </style>

    </svg>
    <br>

    <svg width="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" style="background-color: blue;">
        <path id="my_path3" d="M 20,20 C 80,60 100,40 300,20 " fill="transparent" stroke-width="2" stroke="black"/>
        <text>
            <textPath xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#my_path3" fill="red"
            style="font-size: 10px">
            Me gustas cuando callas porque estás como ausente,
            y me oyes desde lejos, y mi voz no te toca.
            </textPath>
        </text>
    </svg>
    <br>
    <!-- Gradientes -->
    <svg
    viewBox="0 0 15 10"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="500" style="background-color: black;">
        <defs>
            <linearGradient id="linearGradient1" gradientTransform="rotate(90)">
                <stop offset="5%" stop-color="gold" />
                <stop offset="95%" stop-color="red" />
            </linearGradient>
            <radialGradient id="radialGradient1">
                <stop offset="10%" stop-color="gold" />
                <stop offset="95%" stop-color="red" />
            </radialGradient>
        </defs>
        <circle cx="5" cy="5" r="4" fill="url('#linearGradient1')" />
        <circle cx="10" cy="5" r="4" fill="url('#radialGradient1')" />
    </svg>
</body>
</html>
