<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Primer svg</h1>

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="200" height="200" viewBox="-200 -200 400 400"
    style="background-color: lightgray">
        <circle cx="0" cy="0" r="100" fill="none" stroke="red" stroke-width="1" />
        <line x1="-200" y1="0" x2="200" y2="0" stroke="black" stroke-width="1" />
        <line x1="0" y1="-200" x2="0" y2="200" stroke="black" stroke-width="1" />
    </svg>

    <h2>Segundo svg</h2>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="200" height="200">
        <circle cx="0" cy="0" r="100" fill="none" stroke="red" stroke-width="1" />
        <line x1="-200" y1="0" x2="200" y2="0" stroke="black" stroke-width="1" />
        <line x1="0" y1="-200" x2="0" y2="200" stroke="black" stroke-width="1" />
    </svg>

    <h2>Tercer svg</h2>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="200" height="400" viewBox="-100 -100 200 200"
    style="background-color: lightgray">
        <circle cx="0" cy="0" r="100" fill="none" stroke="red" stroke-width="1" />
        <circle cx="0" cy="-150" r="10" fill="red" stroke="blue" stroke-width="1" />
        <line x1="-200" y1="0" x2="200" y2="0" stroke="black" stroke-width="1" />
        <line x1="0" y1="-200" x2="0" y2="200" stroke="black" stroke-width="1" />
    </svg>

    <h2>Cuarto svg</h2>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="300" height="300" viewBox="-95 -95 190 190"
    style="background-color: lightgray">
        <circle cx="-50" cy="0" r="40" fill="none" stroke="blue" stroke-width="2" />
        <circle cx="50" cy="0" r="40" fill="none" stroke="blue" stroke-width="2" />
        <circle cx="0" cy="-50" r="40" fill="none" stroke="green" stroke-width="2" />
        <circle cx="0" cy="50" r="40" fill="none" stroke="green" stroke-width="2" />
        <circle cx="0" cy="0" r="40" fill="none" stroke="red" stroke-width="2" />
    </svg>

    <h2>Quinto svg, superPuestos</h2>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="220" height="170" viewBox="-10 -10 220 170">
        <circle cx="75" cy="75" r="75" fill="red" />
        <circle cx="100" cy="75" r="75" fill="none" stroke="yellow" stroke-width="10"/>
        <circle cx="125" cy="75" r="75" fill="mediumseagreen" />
    </svg>

    <h2>Sexto svg, svg externo</h2>
    <img src="circulo.svg" alt="" width="500" height="200">

    <h2>Ej2</h2>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="300" height="300" viewBox="-125 -125 250 250">
        <circle cx="0" cy="0" r="150" fill="red" />
        <circle cx="0" cy="0" r="100" fill="green" />
    </svg>

    <h2>Ej3 (fill:#550000, fill:880000, fill:AA0000, fill:CC0000,fill:FF0000)</h2>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="200" height="200" viewBox="-50 -100 200 200"
    style="background-color: aquamarine;">
        <circle cx="5" cy="0" r="10" fill="#550000" />
        <circle cx="25" cy="0" r="15" fill="#880000" />
        <circle cx="50" cy="0" r="20" fill="#AA0000" />
        <circle cx="75" cy="0" r="30" fill="#CC0000" />
        <circle cx="100" cy="0" r="35" fill="#FF0000" />
    </svg>

    <h2>Ej4 (fill:#550000, fill:880000, fill:AA0000, fill:CC0000,fill:FF0000)</h2>
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
    width="200" height="200" viewBox="-100 -50 200 200"
    style="background-color: aquamarine;">
        <circle cx="0" cy="5" r="10" fill="#550000" />
        <circle cx="0" cy="25" r="15" fill="#880000" />
        <circle cx="0" cy="50" r="20" fill="#AA0000" />
        <circle cx="0" cy="75" r="30" fill="#CC0000" />
        <circle cx="0" cy="100" r="35" fill="#FF0000" />
    </svg>

</body>

</html>
