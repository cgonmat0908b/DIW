<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Galería interactiva</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }

        h1 {
            margin-top: 20px;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .galeria img {
            width: 120px;
            height: 80px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .galeria img:hover {
            transform: scale(1.1);
        }

        dialog {
            border: none;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
            width: 400px;
            text-align: center;
            padding: 20px;
            background-color: white;
        }

        dialog img {
            width: 100%;
            border-radius: 8px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .cerrar {
            margin-top: 15px;
            border: none;
            background-color: #d9534f;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cerrar:hover {
            background-color: #c9302c;
        }
    </style>
</head>

<body>
    <h1>Galería interactiva</h1>
    <p>Haz clic en una imagen para ver más detalles.</p>

    <div class="galeria">
        <img src="./images/cerezo.jpg" alt="Cerezo" id="img1">
        <img src="./images/corazon.jpg" alt="Corazón" id="img2">
        <img src="./images/epilepsia.jpg" alt="Epilepsia" id="img3">
        <img src="./images/leon.jpg" alt = "leon" id="img4">
        <img src="./images/sol.jpg" alt="sol" id="img5">
    </div>

    <dialog id="dialogCerezo">
        <img id="cerezoGrande" src="./images/cerezo.jpg" alt="Imagen ampliada cerezo" height="300px" width="300px">
        <details>
            <summary>Descripción</summary>
            <p id="descripcion">Imagen de un cerezo</p>
        </details>
        <button class="cerrar" id="cerrarCerezo">Cerrar</button>
    </dialog>
    

    <dialog id="dialogCorazon">
        <img id="corazonGrande" src="./images/corazon.jpg" alt="Imagen ampliada corazon">
        <details >
            <summary>Descripción</summary>
            <p id="descripcion"></p>
        </details>
        <button class="cerrar" id="cerrarCorazon">Cerrar</button>
    </dialog>

    <dialog id="dialogEpilepsia">
        <img id="epilepsia" src="./images/epilepsia.jpg" alt="Imagen ampliada epilepsia">
        <details >
            <summary>Descripción</summary>
            <p id="descripcion"></p>
        </details>
        <button class="cerrar" id="cerrarEpilepsia">Cerrar</button>
    </dialog>

    <dialog id="dialogLeon">
        <img id="leonGrande" src="./images/leon.jpg" alt="Imagen ampliada cerezo">
        <details >
            <summary>Descripción</summary>
            <p id="descripcion"></p>
        </details>
        <button class="cerrar" id="cerrarLeon">Cerrar</button>
    </dialog>

    <dialog id="dialogSol">
        <img id="solGrande" src="./images/sol.jpg" alt="Imagen ampliada sol">
        <details >
            <summary>Descripción</summary>
            <p id="descripcion"></p>
        </details>
        <button class="cerrar" id="cerrarSol">Cerrar</button>
    </dialog>

    <script>

        const dialogCerezo = document.getElementById("dialogCerezo");
        document.getElementById("img1").addEventListener("click", () => dialogCerezo.showModal());
        document.getElementById("cerrarCerezo").addEventListener("click", () => dialogCerezo.close());

        const dialogCorazon = document.getElementById("dialogCorazon");
        document.getElementById("img2").addEventListener("click", () => dialogCorazon.showModal());
        document.getElementById("cerrarCorazon").addEventListener("click", () => dialogCorazon.close());

        const dialogEpilepsia = document.getElementById("dialogEpilepsia");
        document.getElementById("img3").addEventListener("click", () => dialogEpilepsia.showModal());
        document.getElementById("cerrarEpilepsia").addEventListener("click", () => dialogEpilepsia.close());

        const dialogLeon = document.getElementById("dialogLeon");
        document.getElementById("img4").addEventListener("click", () => dialogLeon.showModal());
        document.getElementById("cerrarLeon").addEventListener("click", () => dialogLeon.close());

        const dialogSol = document.getElementById("dialogSol");
        document.getElementById("img5").addEventListener("click", () => dialogSol.showModal());
        document.getElementById("cerrarSol").addEventListener("click", () => dialogSol.close());

        

    </script>

</body>

</html>
