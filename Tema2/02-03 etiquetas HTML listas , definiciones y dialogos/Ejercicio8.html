<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        dialog {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            padding: 20px;
            width: 350px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }
        

        button {
            margin-top: 15px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

    </style>
</head>

<body>

    <h1>Bienvenido</h1>
    <p>Si tienes dudas, abre el centro de ayuda</p>

    <button id="abrir">Abrir centro de ayuda</button>

    <dialog id="centroAyuda">

        <h2>Centro de ayuda</h2>

        <details>
            <summary>¿Qué es este sitio?</summary>
            <p>Página para probar un detail y summary anidado por un dialog</p>
        </details>

        <details>
            <summary>¿Como cierro este cuadro?</summary>
            <p>Haz click en cerrar</p>
        </details>

        <details>
            <summary>¿Qué tecnologias se usan?</summary>
            <p>HTML, CSS y JavaScript</p>
        </details>

        <button id="cerrar">Cerrar</button>

    </dialog>

    <script>
        const centroAyuda = document.getElementById("centroAyuda");
        document.getElementById("abrir").addEventListener("click", () => centroAyuda.showModal());
        document.getElementById("cerrar").addEventListener("click", () => centroAyuda.close());

    </script>
    
</body>

</html>
