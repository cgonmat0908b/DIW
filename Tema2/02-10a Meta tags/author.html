<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Cristian">
    <title>Etiqueta author</title>
</head>
<body>
    <h1>Etiqueta meta author</h1>

    <p>La etiqueta meta author sirve para indicar quién es el autor
    o creador de una página web.</p>

    <p>Se coloca dentro del head del HTML y permite identificar
    a la persona o entidad responsable del contenido de la página.</p>

    <h2>Ejemplo</h2>
    <p>&lt;meta name="author" content="Cristian"&gt;</p>
</body>
</html>
