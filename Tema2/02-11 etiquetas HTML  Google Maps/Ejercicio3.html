<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        #Ej1{
            border: 3px solid black;
            border-collapse: collapse;
            width: 100%;
            height: 1000px;
        }

        #Ej1 td{
            border: 1px solid black;
            
        }
        
        .encabezado{
            padding: 30px;
            text-align: center;
            width: 100%;
        }

        #Header{
            width: 100%;
            height: 15%;
        }
        

        #Cuerpo{
            height: 70%;
            width: 100%;
        }

        #Nav{
            width: 20%;
            text-align: center;
        }

        #Contenido{
            width: 80%;
            text-align: center;
        }

        #Pie{
            width: 100%;
            height: 15%;
        }

        .pies{
            padding: 30px;
            text-align: center;
            width: 100%;
        }

    </style>
</head>

<body>

    <h2>González Mateo Cristian</h2>
    <h2>02-11 etiquetas HTML  Google Maps</h2>

    <h2>
        Ejercicio 3. Crea una panorámica del instituto e insertarla en tu web con un iframe
    </h2>
    
    <table id="Ej1">

        <tr id="Header">
            <td class="encabezado" colspan="2">Bienvenido</td>
        </tr>

        <tr id="Cuerpo">

            <td id="Nav">
                Menu de navegación
            </td>

            <td id="Contenido">
                <iframe src="https://www.google.com/maps/embed?pb=!4v1792863847646!6m8!1m7!1sCAMM6pvihm3MhV8FBTY5dA!2m2!1d36.63412815279719!2d-4.496782977636203!3f294.89404860220543!4f11.512118375687749!5f0.4000000000000002" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </td>

        </tr>

        <tr id="Pie">
            <td class="pies" colspan="2">Pie de página</td>
        </tr>

    </table>
    
</body>

</html>
