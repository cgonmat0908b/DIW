<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta charset</title>
</head>
<body>
    <h1>Etiqueta meta charset</h1>

    <p>La etiqueta meta charset sirve para indicar la codificación
    de caracteres que utiliza una página web.</p>

    <p>Se coloca dentro del head del HTML y permite mostrar correctamente
    letras, tildes, símbolos y caracteres especiales como la ñ.</p>

    <h2>Ejemplo</h2>
    <p>&lt;meta charset="UTF-8"&gt;</p>
</body>
</html>
