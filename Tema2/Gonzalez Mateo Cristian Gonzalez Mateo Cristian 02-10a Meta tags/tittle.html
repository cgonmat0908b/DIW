<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Etiqueta title</title>
</head>
<body>
    <h1>Etiqueta title</h1>

    <p>La etiqueta title sirve para indicar el título de una página web.
    Se coloca dentro del head del documento HTML.</p>

    <p>El título aparece en la pestaña del navegador y también puede
    mostrarse en los resultados de búsqueda de Google.</p>

    <h2>Ejemplo</h2>
    <p>&lt;title&gt;Mi página web&lt;/title&gt;</p>
</body>
</html>
